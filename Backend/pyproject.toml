[tool.poetry]
name = "sorax-backend"
version = "0.0.1"
description = "AI automation backend for Sorax Industrial Solution"
authors = ["Ahtesham Ahmed"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
sqlmodel = "^0.0.22"
psycopg2-binary = "^2.9.10"
alembic = "^1.13.0"
openai = "^1.52.0"
python-dotenv = "^1.0.0"
pydantic-settings = "^2.5.0"
"passlib[argon2]" = "^1.7.4"
"python-jose[cryptography]" = "^3.3.0"
ruff = "^0.6.0"
mypy = "^1.11.0"
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
weasyprint = "^62.0"
apscheduler = "^3.10.0"
jinja2 = "^3.1.0"
email-validator = "^2.2.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.0"
mypy = "^1.11.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error", "ignore::DeprecationWarning"]